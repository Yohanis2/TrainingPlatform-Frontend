<nz-layout class="app-shell">
  <nz-sider
    nzCollapsible
    [nzTrigger]="null"
    nzBreakpoint="lg"
    [nzCollapsed]="collapsed()"
    [nzCollapsedWidth]="isMobile() ? 0 : 80"
    (nzCollapsedChange)="onSiderCollapsedChange($event)"
    (nzBreakpoint)="onSiderBreakpoint($event)"
    nzWidth="260"
    nzTheme="light"
  >
    <div class="brand">
      <div class="brand-mark">TPC</div>
      <div class="brand-copy" *ngIf="!collapsed()">
        <span class="brand-title">Training Platform</span>
        <span class="brand-subtitle">Connections, growth, and trust.</span>
      </div>
    </div>

    <ul nz-menu nzMode="inline" nzTheme="light" [nzInlineCollapsed]="collapsed()">
      <li nz-menu-item routerLink="/dashboard" routerLinkActive="active" (click)="onMenuItemClick()">
        <span nz-icon nzType="appstore"></span>
        <span>Overview</span>
      </li>
      <li nz-menu-item routerLink="/trainings" routerLinkActive="active" (click)="onMenuItemClick()">
        <span nz-icon nzType="calendar"></span>
        <span>Trainings</span>
      </li>
      <li nz-menu-item routerLink="/connections" routerLinkActive="active" (click)="onMenuItemClick()">
        <span nz-icon nzType="team"></span>
        <span>Connections</span>
      </li>
      <li nz-menu-item routerLink="/messages" routerLinkActive="active" (click)="onMenuItemClick()">
        <span nz-icon nzType="message"></span>
        <span>Messages</span>
      </li>
      <li nz-menu-item routerLink="/notifications" routerLinkActive="active" (click)="onMenuItemClick()">
        <span nz-icon nzType="bell"></span>
        <span>Notifications</span>
      </li>
      <li nz-menu-item routerLink="/admin/users" routerLinkActive="active" (click)="onMenuItemClick()">
        <span nz-icon nzType="tool"></span>
        <span>Admin</span>
      </li>
    </ul>
  </nz-sider>

  <nz-layout>
    <nz-header class="app-header">
      <button
        nz-button
        nzType="text"
        nzShape="circle"
        class="nav-toggle"
        (click)="toggleCollapsed()"
        [attr.aria-label]="collapsed() ? 'Open navigation menu' : 'Collapse navigation menu'"
      >
        <span nz-icon [nzType]="collapsed() ? 'menu-unfold' : 'menu-fold'"></span>
      </button>

      <div class="header-actions">
        <button nz-button nzType="text" nzShape="circle" class="header-icon" routerLink="/notifications">
          <nz-badge [nzCount]="unreadCount()" [nzOverflowCount]="99">
            <span nz-icon nzType="bell"></span>
          </nz-badge>
        </button>
        <div nz-dropdown [nzDropdownMenu]="userMenu" nzPlacement="bottomRight">
          <button nz-button nzType="text" class="user-button">
            <nz-avatar nzIcon="user"></nz-avatar>
            <span class="user-name" *ngIf="user$ | async as user">{{ user.name }}</span>
            <span nz-icon nzType="down"></span>
          </button>
        </div>
        <nz-dropdown-menu #userMenu="nzDropdownMenu">
          <ul nz-menu>
            <li nz-menu-item routerLink="/trainings/created">My Trainings</li>
            <li nz-menu-item routerLink="/trainings/enrolled">My Enrollments</li>
            <li nz-menu-divider></li>
            <li nz-menu-item (click)="logout()">Sign out</li>
          </ul>
        </nz-dropdown-menu>
      </div>
    </nz-header>

    <nz-content class="app-content">
      <router-outlet></router-outlet>
    </nz-content>
  </nz-layout>
</nz-layout>
