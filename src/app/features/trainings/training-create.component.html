<nz-page-header
  class="page-header"
  nzTitle="Create training"
  nzSubtitle="Publish a new program with schedules, pricing, and capacity limits."
></nz-page-header>

<nz-card nzBordered="false" class="create-card">
  <form nz-form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-grid">
      <nz-form-item>
        <nz-form-label [nzSpan]="24">Title</nz-form-label>
        <nz-form-control [nzSpan]="24" nzErrorTip="Title is required">
          <input nz-input formControlName="title" placeholder="Leadership cohort" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label [nzSpan]="24">Category</nz-form-label>
        <nz-form-control [nzSpan]="24" nzErrorTip="Select a category">
          <nz-select formControlName="categoryId" nzPlaceHolder="Choose category">
            <nz-option
              *ngFor="let category of categories$ | async; trackBy: trackCategory"
              [nzValue]="category.id"
              [nzLabel]="category.name"
            ></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label [nzSpan]="24">Level</nz-form-label>
        <nz-form-control [nzSpan]="24">
          <nz-select formControlName="level">
            <nz-option *ngFor="let level of levels" [nzValue]="level" [nzLabel]="level"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label [nzSpan]="24">Price</nz-form-label>
        <nz-form-control [nzSpan]="24">
          <nz-input-number formControlName="price" [nzMin]="0"></nz-input-number>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label [nzSpan]="24">Capacity</nz-form-label>
        <nz-form-control [nzSpan]="24">
          <nz-input-number formControlName="capacity" [nzMin]="1"></nz-input-number>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label [nzSpan]="24">Start date</nz-form-label>
        <nz-form-control [nzSpan]="24">
          <nz-date-picker formControlName="startDate" nzShowTime></nz-date-picker>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label [nzSpan]="24">End date</nz-form-label>
        <nz-form-control [nzSpan]="24">
          <nz-date-picker formControlName="endDate" nzShowTime></nz-date-picker>
        </nz-form-control>
      </nz-form-item>
    </div>

    <nz-form-item>
      <nz-form-label [nzSpan]="24">Description</nz-form-label>
      <nz-form-control [nzSpan]="24" nzErrorTip="Description is required">
        <textarea nz-input rows="4" formControlName="description" placeholder="Describe the training"></textarea>
      </nz-form-control>
    </nz-form-item>

    <div class="actions">
      <button nz-button nzType="primary" [nzLoading]="loading()">Publish training</button>
    </div>
  </form>
</nz-card>
